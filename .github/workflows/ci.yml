name: CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore IpoBuddy.sln

    - name: Build
      run: dotnet build IpoBuddy.sln --no-restore --configuration Release

    - name: Run Automated Tests
      run: dotnet test IpoBuddy.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend Quality Gates (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Lint Check
      run: npm run lint

    - name: TypeScript Type Check
      run: npx tsc --noEmit

    - name: Build Next.js Production Bundle
      run: npm run build
      env:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGFybGluZy1waWdlb24tNDY1LmNsZXJrLmFjY291bnRzLmRldiQ
        CLERK_SECRET_KEY: sk_test_413zn1rNaoRoyXZuEkSHKIgElsIKLWzj9NHxehuvUR
        NEXT_PUBLIC_API_URL: https://ipobuddy-api.onrender.com/api
